<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#3D4E70;
    --paper:#F5F7FA;
    --panel:#FFFFFF;
    --line:#E3E8F0;
    --mango:#FF9F1C;
    --mango-deep:#E8850A;
    --mint:#06D6A0;
    --coral:#EF476F;
    --accent: var(--mango);
    --radius-lg: 22px;
    --radius-sm: 12px;
    --shadow: 0 8px 24px -12px rgba(27,42,74,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  h1,h2,h3,.display{font-family:'Kanit',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  ::selection{background:var(--mango); color:#fff;}

  /* ── Top bar ─────────────────────────────────────── */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:rgba(245,247,250,.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar__brand{display:flex; align-items:center; gap:10px; font-family:'Kanit',sans-serif; font-weight:600; font-size:15px;}
  .topbar__dot{width:10px;height:10px;border-radius:50%; background:var(--accent);}
  .iconbtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line);
    cursor:pointer; font-size:16px;
  }
  .iconbtn:active{ transform:scale(.94); }

  /* ── Hero ticket ─────────────────────────────────── */
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}
  .hero{
    margin-top:18px;
    background:linear-gradient(155deg, var(--ink) 0%, #24365F 65%, #2C3F6B 100%);
    color:#fff;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 85% -10%, rgba(255,159,28,.35), transparent 45%);
    pointer-events:none;
  }
  .hero__eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; color:#C9D4EA; font-weight:500;
  }
  .hero__title{
    margin:10px 0 4px; font-size:22px; font-weight:700; line-height:1.35;
  }
  .hero__faculty{ font-size:14.5px; color:#DCE4F5; margin:0 0 18px; }
  .hero__meta{ display:flex; flex-wrap:wrap; gap:8px; }
  .pill{
    font-size:12.5px; padding:5px 12px; border-radius:100px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
  }
  .countdown{
    margin-top:18px;
    display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px; padding:14px 16px;
  }
  .countdown__num{ font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; color:var(--mango); line-height:1;}
  .countdown__label{ font-size:12.5px; color:#DCE4F5; }
  .countdown__label b{ color:#fff; display:block; font-size:13.5px; margin-bottom:2px;}

  /* perforation divider — ticket stub cut */
  .perf{
    position:relative; height:0;
    background:transparent;
  }
  .perf .notch{
    position:absolute; top:-13px; width:26px; height:26px; border-radius:50%;
    background:var(--paper); z-index:2;
  }
  .perf .notch.left{ left:-13px; }
  .perf .notch.right{ right:-13px; }
  .perf__line{
    border-top:2px dashed #C9D2E3;
    margin:0 20px;
  }
  .stub-base{
    background:var(--panel);
    border-radius:0 0 var(--radius-lg) var(--radius-lg);
    box-shadow:var(--shadow);
    padding:18px 20px 4px;
  }

  /* ── Timeline strip ──────────────────────────────── */
  .timeline{
    display:flex; gap:0; overflow-x:auto; padding:6px 2px 14px;
    scrollbar-width:none;
  }
  .timeline::-webkit-scrollbar{display:none;}
  .tl-item{
    flex:0 0 auto; width:150px; padding:0 14px 0 0; position:relative;
  }
  .tl-item::before{
    content:""; position:absolute; top:6px; left:0; width:100%; height:2px; background:var(--line);
  }
  .tl-item:last-child::before{ width:0; }
  .tl-dot{
    width:12px;height:12px;border-radius:50%; background:var(--ink-soft);
    border:2px solid var(--panel); box-shadow:0 0 0 2px var(--line);
    margin-bottom:10px; position:relative; z-index:1;
  }
  .tl-item.done .tl-dot{ background:var(--mint); box-shadow:0 0 0 2px var(--mint);}
  .tl-item.next .tl-dot{ background:var(--coral); box-shadow:0 0 0 2px var(--coral);}
  .tl-date{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--ink);}
  .tl-label{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .tl-note{ font-size:11px; color:var(--mango-deep); margin-top:2px; font-weight:600;}

  /* ── Sections ────────────────────────────────────── */
  section.block{ margin-top:20px; }
  .block__head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .block__title{ font-size:16px; font-weight:700; margin:0; }
  .block__sub{ font-size:12.5px; color:var(--ink-soft); }

  /* quick facts */
  .facts{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .fact{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:14px; text-align:left;
  }
  .fact__value{ font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--ink);}
  .fact__label{ font-size:12px; color:var(--ink-soft); margin-top:3px;}

  /* search + filter */
  .searchbar{
    position:sticky; top:64px; z-index:30;
    background:var(--paper); padding:10px 0;
  }
  .searchbox{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1.5px solid var(--line); border-radius:100px;
    padding:10px 16px;
  }
  .searchbox input{
    border:none; outline:none; background:transparent; width:100%;
    font-family:'Sarabun',sans-serif; font-size:14.5px; color:var(--ink);
  }
  .chips{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chip{
    font-size:12.5px; padding:6px 13px; border-radius:100px;
    background:var(--panel); border:1.5px solid var(--line); cursor:pointer;
    font-weight:500; color:var(--ink-soft);
  }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  /* major cards */
  .major{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    margin-bottom:10px; overflow:hidden;
  }
  .major__row{
    display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer;
  }
  .major__code{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:#fff;
    background:var(--ink-soft); border-radius:8px; padding:5px 8px; flex:0 0 auto;
  }
  .major__name{ font-size:14px; font-weight:600; flex:1; }
  .major__nameEn{ font-size:11.5px; color:var(--ink-soft); font-weight:500; }
  .major__quota{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px;
    color:var(--mango-deep); flex:0 0 auto;
  }
  .major__caret{ color:var(--ink-soft); transition:transform .2s ease; flex:0 0 auto;}
  .major.open .major__caret{ transform:rotate(180deg); }
  .major__detail{
    max-height:0; overflow:hidden; transition:max-height .25s ease;
    border-top:1px solid var(--line);
  }
  .major.open .major__detail{ max-height:200px; }
  .major__detail-inner{ padding:12px 14px 14px; font-size:13px; color:var(--ink-soft);}
  .major__detail-inner .qline{ display:flex; justify-content:space-between; padding:3px 0;}

  .empty{ text-align:center; padding:30px 10px; color:var(--ink-soft); font-size:13.5px;}

  /* documents */
  .doclist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .doclist li{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 14px; font-size:13.5px;
  }
  .doclist .box{
    width:19px; height:19px; border-radius:6px; border:2px solid var(--mint); flex:0 0 auto; margin-top:1px;
  }

  /* qualifications list */
  .quallist{ margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:8px;}
  .quallist li{
    font-size:13.5px; color:var(--ink-soft); padding-left:18px; position:relative;
  }
  .quallist li::before{
    content:""; position:absolute; left:0; top:7px; width:7px; height:7px; border-radius:2px;
    background:var(--mango);
  }

  /* contact */
  .contact-card{
    background:var(--ink); color:#fff; border-radius:var(--radius-lg);
    padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .contact-card__text{ font-size:13.5px; color:#C9D4EA; }
  .contact-card__link{
    background:var(--mango); color:var(--ink); font-weight:700; font-size:13px;
    padding:9px 16px; border-radius:100px; text-decoration:none; white-space:nowrap;
  }
  .source-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin:22px 0 6px; opacity:.8; }

  /* floating action bar */
  .fab-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; gap:10px; justify-content:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, var(--paper) 60%, rgba(245,247,250,0));
  }
  .fab{
    flex:1; max-width:220px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Kanit',sans-serif; font-weight:600; font-size:14px;
    padding:13px 18px; border-radius:100px; border:none; cursor:pointer;
  }
  .fab--primary{ background:var(--ink); color:#fff; box-shadow:var(--shadow); }
  .fab--ghost{ background:var(--panel); color:var(--ink); border:1.5px solid var(--line); }
  .fab:active{ transform:scale(.97); }

  @media print{
    .topbar, .searchbar, .fab-bar, .chips{ display:none !important; }
    body{ padding-bottom:0; background:#fff; }
    .major__detail{ max-height:none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar__brand"><span class="topbar__dot"></span><span id="brand-text">มจพ.</span></div>
  <div class="iconbtn" id="shareBtn" title="แชร์">🔗</div>
</div>

<div class="wrap">

  <div class="hero" id="hero">
    <div class="hero__eyebrow">🎓 <span id="ev-round">โควตาเรียนดี</span> · ปีการศึกษา <span id="ev-year" class="mono"></span></div>
    <h1 class="hero__title" id="ev-faculty"></h1>
    <p class="hero__faculty" id="ev-university"></p>
    <div class="hero__meta" id="ev-meta"></div>

    <div class="countdown" id="countdownBox">
      <div class="countdown__num" id="cdNum">–</div>
      <div class="countdown__label"><b id="cdLabel">กำลังคำนวณ…</b><span id="cdDate"></span></div>
    </div>
  </div>

  <div class="perf">
    <span class="notch left"></span><span class="notch right"></span>
    <div class="perf__line"></div>
  </div>

  <div class="stub-base">
    <div class="block__head" style="margin-bottom:4px;">
      <p class="block__title" style="font-size:14px;">🗓️ ไทม์ไลน์การรับสมัคร</p>
    </div>
    <div class="timeline" id="timelineWrap"></div>
  </div>

  <section class="block">
    <div class="facts" id="factsWrap"></div>
  </section>

  <section class="block">
    <div class="block__head">
      <h2 class="block__title">📚 สาขาวิชาที่เปิดรับ</h2>
      <span class="block__sub" id="majorCount"></span>
    </div>
    <div class="searchbar">
      <div class="searchbox">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อสาขา หรือรหัสสาขา…">
      </div>
      <div class="chips" id="chipsWrap"></div>
    </div>
    <div id="majorsWrap"></div>
  </section>

  <section class="block">
    <h2 class="block__title">✅ คุณสมบัติผู้สมัคร</h2>
    <ul class="quallist" id="qualWrap" style="margin-top:12px;"></ul>
  </section>

  <section class="block">
    <h2 class="block__title">📎 เอกสารที่ต้องเตรียม</h2>
    <ul class="doclist" id="docWrap" style="margin-top:12px;"></ul>
  </section>

  <section class="block">
    <div class="contact-card">
      <div>
        <div style="font-family:'Kanit',sans-serif; font-weight:600; margin-bottom:4px;">สอบถามเพิ่มเติม</div>
        <div class="contact-card__text" id="contactText"></div>
      </div>
      <a class="contact-card__link" id="applyLink" href="#" target="_blank" rel="noopener">สมัครเลย</a>
    </div>
    <p class="source-note" id="sourceNote"></p>
  </section>

</div>

<div class="fab-bar">
  <button class="fab fab--ghost" id="printBtn">🖨️ พิมพ์เก็บไว้</button>
  <button class="fab fab--primary" id="applyBtn">สมัครเลย →</button>
</div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('announcement-data').textContent);
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls) n.className=cls; if(html!==undefined) n.innerHTML=html; return n; };
  const escHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ── Header / hero ─────────────────────────
  document.title = `${DATA.meta.programTitle} | ${DATA.meta.faculty} ${DATA.meta.universityShort} ${DATA.meta.academicYear}`;
  $('#brand-text').textContent = DATA.meta.universityShort;
  $('#ev-round').textContent = DATA.meta.round;
  $('#ev-year').textContent = DATA.meta.academicYear;
  $('#ev-faculty').textContent = DATA.meta.programTitle;
  $('#ev-university').textContent = `${DATA.meta.faculty} · ${DATA.meta.university}`;

  const metaWrap = $('#ev-meta');
  [DATA.meta.degreeLevel, ...(DATA.qualifications.educationLevel || [])].forEach(t=>{
    metaWrap.appendChild(el('span','pill',escHtml(t)));
  });

  // ── Countdown ─────────────────────────────
  function daysUntil(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr); target.setHours(0,0,0,0);
    return Math.round((target-today)/86400000);
  }
  const upcoming = DATA.timeline
    .map(t=>({...t, diff:daysUntil(t.date)}))
    .filter(t=>t.diff>=0)
    .sort((a,b)=>a.diff-b.diff)[0];

  if(upcoming){
    $('#cdNum').textContent = upcoming.diff;
    $('#cdLabel').textContent = upcoming.diff===0 ? `วันนี้: ${upcoming.label}` : `อีก ${upcoming.diff} วัน ถึง`;
    $('#cdDate').textContent = upcoming.diff===0 ? '' : `${upcoming.label} · ${upcoming.dateDisplay}`;
    if(upcoming.isDeadline && upcoming.diff<=14){
      $('#countdownBox').style.background = 'rgba(239,71,111,.18)';
      $('#countdownBox').style.borderColor = 'rgba(239,71,111,.4)';
      $('#cdNum').style.color = '#FF8FA3';
    }
  } else {
    $('#cdNum').textContent = '🏁';
    $('#cdLabel').textContent = 'ครบทุกขั้นตอนแล้ว';
    $('#cdDate').textContent = 'ตรวจสอบผลได้ตามประกาศ';
  }

  // ── Timeline strip ────────────────────────
  const tlWrap = $('#timelineWrap');
  const todayDiff0 = DATA.timeline.map(t=>daysUntil(t.date));
  DATA.timeline.forEach((t,i)=>{
    const diff = todayDiff0[i];
    const item = el('div','tl-item');
    if(diff<0) item.classList.add('done');
    else if(upcoming && t.date===upcoming.date) item.classList.add('next');
    item.appendChild(el('div','tl-dot'));
    item.appendChild(el('div','tl-date mono', escHtml(t.dateDisplay)));
    item.appendChild(el('div','tl-label', escHtml(t.label)));
    if(t.note) item.appendChild(el('div','tl-note', escHtml(t.note)));
    tlWrap.appendChild(item);
  });

  // ── Quick facts ───────────────────────────
  const factsWrap = $('#factsWrap');
  const totalByLabel = {};
  DATA.majors.forEach(m => m.quotas.forEach(q=>{ totalByLabel[q.label] = (totalByLabel[q.label]||0) + (q.value||0); }));
  const facts = [];
  if(DATA.qualifications.gpaxMin) facts.push({v:DATA.qualifications.gpaxMin.toFixed(2), l:'GPAX ขั้นต่ำ'});
  facts.push({v:DATA.majors.length, l:'สาขาวิชาที่เปิดรับ'});
  Object.entries(totalByLabel).forEach(([label,val])=> facts.push({v:val, l:`รับรวม (${label})`}));
  if(DATA.applicationFee) facts.push({v:`${DATA.applicationFee.toLocaleString()}฿`, l:'ค่าสมัครสอบ'});
  if(DATA.maxChoices) facts.push({v:DATA.maxChoices, l:'เลือกสมัครได้สูงสุด (อันดับ)'});
  facts.forEach(f=>{
    const c = el('div','fact');
    c.appendChild(el('div','fact__value mono', escHtml(String(f.v))));
    c.appendChild(el('div','fact__label', escHtml(f.l)));
    factsWrap.appendChild(c);
  });

  // ── Majors: search + filter + render ─────
  const quotaLabels = Object.keys(totalByLabel);
  const chipsWrap = $('#chipsWrap');
  let activeFilter = 'all';
  if(quotaLabels.length > 1){
    const allChip = el('div','chip active','ทั้งหมด');
    allChip.onclick = ()=>setFilter('all');
    chipsWrap.appendChild(allChip);
    quotaLabels.forEach(label=>{
      const c = el('div','chip', escHtml(label));
      c.onclick = ()=>setFilter(label);
      chipsWrap.appendChild(c);
    });
  }
  function setFilter(f){
    activeFilter = f;
    [...chipsWrap.children].forEach(c=>c.classList.toggle('active', c.textContent===(f==='all'?'ทั้งหมด':f)));
    renderMajors();
  }

  $('#majorCount').textContent = `${DATA.majors.length} สาขา`;
  const majorsWrap = $('#majorsWrap');
  const searchInput = $('#searchInput');

  function renderMajors(){
    const q = searchInput.value.trim().toLowerCase();
    majorsWrap.innerHTML = '';
    const filtered = DATA.majors.filter(m=>{
      const text = `${m.code} ${m.name} ${m.nameEn}`.toLowerCase();
      const matchesQ = !q || text.includes(q);
      const matchesFilter = activeFilter==='all' || m.quotas.some(qq=>qq.label===activeFilter);
      return matchesQ && matchesFilter;
    });
    if(filtered.length===0){
      majorsWrap.appendChild(el('div','empty','ไม่พบสาขาวิชาที่ตรงกับคำค้นหา 🔍'));
      return;
    }
    filtered.forEach(m=>{
      const card = el('div','major');
      const row = el('div','major__row');
      row.appendChild(el('div','major__code mono', escHtml(m.code)));
      const nameBox = el('div','', `<div class="major__name">${escHtml(m.name)}</div><div class="major__nameEn mono">${escHtml(m.nameEn)}</div>`);
      nameBox.style.flex = '1';
      row.appendChild(nameBox);
      row.appendChild(el('div','major__quota', escHtml(String(m.quotas[0]?.value ?? '-'))));
      row.appendChild(el('div','major__caret','▾'));
      row.onclick = ()=> card.classList.toggle('open');
      card.appendChild(row);

      const detail = el('div','major__detail');
      let qLines = m.quotas.map(qq=>`<div class="qline"><span>${escHtml(qq.label)}</span><span class="mono">${escHtml(String(qq.value))} คน</span></div>`).join('');
      if(m.note) qLines += `<div class="qline" style="color:var(--mango-deep);">${escHtml(m.note)}</div>`;
      detail.appendChild(el('div','major__detail-inner', qLines));
      card.appendChild(detail);
      majorsWrap.appendChild(card);
    });
  }
  searchInput.addEventListener('input', renderMajors);
  renderMajors();

  // ── Qualifications ────────────────────────
  const qualWrap = $('#qualWrap');
  if(DATA.qualifications.gpaxNote) qualWrap.appendChild(el('li', '', escHtml(DATA.qualifications.gpaxNote)));
  (DATA.qualifications.otherRequirements||[]).forEach(r=> qualWrap.appendChild(el('li','',escHtml(r))));

  // ── Documents ─────────────────────────────
  const docWrap = $('#docWrap');
  (DATA.documents||[]).forEach(d=>{
    const li = el('li');
    li.appendChild(el('span','box'));
    li.appendChild(el('span','',escHtml(d)));
    docWrap.appendChild(li);
  });

  // ── Contact / apply ───────────────────────
  $('#contactText').textContent = DATA.contact?.website || '';
  $('#applyLink').href = DATA.applyUrl || '#';
  $('#applyBtn').onclick = ()=> window.open(DATA.applyUrl || '#', '_blank');
  $('#printBtn').onclick = ()=> window.print();
  $('#sourceNote').textContent = DATA.meta.sourceNote || '';

  // ── Share ─────────────────────────────────
  $('#shareBtn').onclick = async ()=>{
    const shareData = { title: document.title, url: location.href };
    if(navigator.share){ try{ await navigator.share(shareData); }catch(e){} }
    else { navigator.clipboard?.writeText(location.href); $('#shareBtn').textContent='✅'; setTimeout(()=>$('#shareBtn').textContent='🔗',1200); }
  };
})();
</script>
</body>
</html>
