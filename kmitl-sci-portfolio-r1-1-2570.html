<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1B2A4A; --ink-soft:#3D4E70; --paper:#F5F7FA; --panel:#FFFFFF;
    --line:#E3E8F0; --mango:#FF9F1C; --mango-deep:#E8850A; --mint:#06D6A0; --coral:#EF476F;
    --accent:#C0392B;
    --radius-lg:22px; --radius-sm:14px; --shadow:0 8px 24px -12px rgba(27,42,74,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Sarabun',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display{font-family:'Kanit',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:0 16px 48px;}
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:#DCE4F5; text-decoration:none; margin-bottom:10px;}

  .hero{
    background:linear-gradient(155deg, var(--ink) 0%, #24365F 65%, #2C3F6B 100%);
    color:#fff; padding:22px 20px 26px; border-radius:0 0 var(--radius-lg) var(--radius-lg);
    position:relative; overflow:hidden;
  }
  .hero::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 85% -10%, rgba(255,159,28,.35), transparent 45%); pointer-events:none;}
  .hero__uni{ font-size:12.5px; color:#C9D4EA; }
  .hero__title{ font-size:20px; font-weight:700; margin:8px 0 4px; line-height:1.4;}
  .hero__meta{ font-size:12.5px; color:#DCE4F5; }
  .hero__badges{ display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;}
  .hbadge{ font-size:11.5px; padding:5px 11px; border-radius:100px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); }

  .section{ margin-top:22px; }
  .section__title{ font-size:16px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; }

  /* Timeline */
  .tl{ position:relative; padding-left:22px; }
  .tl::before{ content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line);}
  .tl-item{ position:relative; padding-bottom:16px; }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-dot{ position:absolute; left:-22px; top:3px; width:12px; height:12px; border-radius:50%; background:var(--panel); border:2.5px solid var(--ink-soft);}
  .tl-dot.deadline{ border-color:var(--coral); background:var(--coral); }
  .tl-label{ font-weight:600; font-size:13.5px; }
  .tl-date{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .tl-tag{ display:inline-block; font-size:10.5px; color:var(--coral); font-weight:600; margin-left:6px; }

  /* Qualifications */
  .qlist{ margin:0; padding-left:18px; font-size:13.5px; }
  .qlist li{ margin-bottom:6px; }

  /* Major cards */
  .major{ background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:var(--radius-sm); padding:16px; margin-bottom:14px; }
  .major__head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .major__name{ font-weight:700; font-size:15px; line-height:1.4; }
  .major__quota{ font-size:12px; color:var(--ink-soft); white-space:nowrap; text-align:right; }
  .major__quota b{ font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:16px; display:block; }
  .rank2tag{ display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:100px; background:#E4FBF3; color:#0A9E77; margin-top:4px;}
  .rank2tag.no{ background:#FDE7EC; color:var(--coral); }

  table.elig{ width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0; }
  table.elig th, table.elig td{ border:1px solid var(--line); padding:6px 8px; text-align:center; }
  table.elig th{ background:#EEF2FA; font-weight:600; color:var(--ink-soft); }
  table.elig td.proj{ text-align:left; font-weight:600; }
  table.elig td.gpax{ font-family:'IBM Plex Mono',monospace; font-weight:600; }

  table.crit{ width:100%; border-collapse:collapse; font-size:12.5px; margin:8px 0 4px; }
  table.crit th, table.crit td{ border:1px solid var(--line); padding:6px 8px; }
  table.crit th{ background:#FFF3E2; color:var(--mango-deep); text-align:left; }
  table.crit td.w{ text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600; }

  .major__note{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .fee{ font-size:12px; color:var(--ink-soft); margin-top:8px; }
  .fee b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }

  .doclist{ margin:0; padding-left:18px; font-size:13px; }
  .doclist li{ margin-bottom:6px; }

  .cta{
    display:block; text-align:center; background:var(--accent); color:#fff; font-weight:700;
    padding:15px; border-radius:100px; text-decoration:none; margin-top:8px; font-size:14.5px;
    box-shadow:0 10px 20px -8px rgba(192,57,43,.5);
  }
  .contact{ font-size:13px; line-height:1.9; }
  .footer-note{ text-align:center; font-size:11px; color:var(--ink-soft); opacity:.7; margin-top:26px; }
</style>
</head>
<body>
<div class="hero">
  <div class="wrap" style="padding:0;">
    <a class="back" href="index.html">← กลับหน้ารวมประกาศ</a>
    <div class="hero__uni" id="uniLine"></div>
    <div class="hero__title" id="titleLine"></div>
    <div class="hero__meta" id="metaLine"></div>
    <div class="hero__badges" id="badgesLine"></div>
  </div>
</div>

<div class="wrap">

  <div class="section">
    <div class="section__title">📅 กำหนดการ</div>
    <div class="panel"><div class="tl" id="timeline"></div></div>
  </div>

  <div class="section">
    <div class="section__title">✅ คุณสมบัติทั่วไป</div>
    <div class="panel"><ul class="qlist" id="qualList"></ul></div>
  </div>

  <div class="section">
    <div class="section__title">🎓 สาขาวิชาที่เปิดรับ (<span id="majorCount"></span> สาขา)</div>
    <div id="majorsWrap"></div>
  </div>

  <div class="section">
    <div class="section__title">📎 เอกสารประกอบการสมัคร/สัมภาษณ์</div>
    <div class="panel"><ul class="doclist" id="docList"></ul></div>
  </div>

  <div class="section">
    <div class="section__title">📞 ติดต่อสอบถาม / สมัคร</div>
    <div class="panel">
      <div class="contact" id="contactBox"></div>
      <a class="cta" id="applyBtn" target="_blank" rel="noopener">สมัครที่เว็บไซต์มหาวิทยาลัย →</a>
    </div>
  </div>

  <p class="footer-note" id="sourceNote"></p>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls) n.className=cls; if(html!==undefined) n.innerHTML=html; return n; };
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const fmtNum = n => (n===null || n===undefined) ? '—' : Number(n).toLocaleString();

  const data = JSON.parse(document.getElementById('announcement-data').textContent);
  const { meta, timeline, qualifications, documents, majors, applyUrl, contact } = data;

  document.title = `${meta.programTitle} | ${meta.university}`;
  if(meta.accentColor) document.documentElement.style.setProperty('--accent', meta.accentColor);

  $('#uniLine').textContent = `${meta.universityShort} · ${meta.faculty}`;
  $('#titleLine').textContent = meta.programTitle;
  $('#metaLine').textContent = `ปีการศึกษา ${meta.academicYear}`;

  const badgesLine = $('#badgesLine');
  (qualifications.educationLevel||[]).forEach(l => badgesLine.appendChild(el('span','hbadge', esc(l))));
  badgesLine.appendChild(el('span','hbadge', esc(meta.round)));

  // ── Timeline ──────────────────────────────────
  const tl = $('#timeline');
  timeline.forEach(t=>{
    const item = el('div','tl-item');
    item.appendChild(el('div', 'tl-dot' + (t.isDeadline ? ' deadline' : '')));
    const label = el('div','tl-label', esc(t.label) + (t.isDeadline ? '<span class="tl-tag">ปิดรับ</span>' : ''));
    item.appendChild(label);
    item.appendChild(el('div','tl-date', esc(t.dateDisplay)));
    tl.appendChild(item);
  });

  // ── Qualifications ────────────────────────────
  const ql = $('#qualList');
  (qualifications.otherRequirements||[]).forEach(r => ql.appendChild(el('li','', esc(r))));

  // ── Majors ────────────────────────────────────
  $('#majorCount').textContent = majors.length;
  const majorsWrap = $('#majorsWrap');

  majors.forEach(m=>{
    const card = el('div','major');

    const head = el('div','major__head');
    const nameBox = el('div');
    nameBox.appendChild(el('div','major__name', esc(m.name)));
    nameBox.appendChild(el('span', m.rank2Eligible ? 'rank2tag' : 'rank2tag no',
      m.rank2Eligible ? '✓ เลือกเป็นอันดับ 2 ได้' : '✕ เลือกได้เฉพาะอันดับ 1'));
    head.appendChild(nameBox);
    const quotaBox = el('div','major__quota', `รับ<b>${fmtNum(m.quotas[0].value)}</b>คน`);
    head.appendChild(quotaBox);
    card.appendChild(head);

    // เกณฑ์คุณสมบัติรายโครงการ
    if(m.eligibility && m.eligibility.length){
      const tbl = el('table','elig');
      const hasGroup = m.eligibility.some(e=>e.gpaxGroup);
      tbl.appendChild(el('thead','', `<tr>
        <th style="text-align:left;">โครงการ</th>
        <th>แผนการเรียน</th>
        <th>GPAX รวม</th>
        ${hasGroup ? '<th>GPAX กลุ่มวิชา</th>' : ''}
      </tr>`));
      const tbody = el('tbody');
      m.eligibility.forEach(e=>{
        const tr = el('tr');
        tr.appendChild(el('td','proj', esc(e.project)));
        tr.appendChild(el('td','', esc((e.plans||[]).join(', '))));
        tr.appendChild(el('td','gpax', e.gpaxTotal ? '≥ '+e.gpaxTotal.toFixed(2) : 'ไม่กำหนด'));
        if(hasGroup) tr.appendChild(el('td','gpax', e.gpaxGroup ? '≥ '+e.gpaxGroup.toFixed(2)+(e.groupLabel?` (${esc(e.groupLabel)})`:'') : '—'));
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      card.appendChild(tbl);
      card.appendChild(el('div','fee', `<b>${esc(m.gpaxPeriod||'')}</b>`));
    }

    // เกณฑ์คะแนนคัดเลือก
    if(m.criteria && m.criteria.length){
      const ctbl = el('table','crit');
      ctbl.appendChild(el('thead','', `<tr><th>เกณฑ์การพิจารณา</th><th class="w">น้ำหนัก</th></tr>`));
      const cbody = el('tbody');
      m.criteria.forEach(c=>{
        const tr = el('tr');
        tr.appendChild(el('td','', esc(c.name)));
        tr.appendChild(el('td','w', c.weight+'%'));
        cbody.appendChild(tr);
      });
      ctbl.appendChild(cbody);
      card.appendChild(ctbl);
    }

    card.appendChild(el('div','fee', `ค่าธรรมเนียมการศึกษา <b>${fmtNum(m.tuitionPerTerm)} บาท</b> / ภาคการศึกษา`));

    if(m.note) card.appendChild(el('div','major__note', esc(m.note)));

    majorsWrap.appendChild(card);
  });

  // ── Documents ─────────────────────────────────
  const dl = $('#docList');
  documents.forEach(d => dl.appendChild(el('li','', esc(d))));

  // ── Contact ───────────────────────────────────
  const c = contact || {};
  const contactLines = [
    c.phone ? `☎️ ${esc(c.phone)}` : '',
    c.mobile ? `📱 ${esc(c.mobile)}` : '',
    c.email ? `✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '',
    c.facebook ? `📘 ${esc(c.facebook)}` : '',
    c.note ? `<span style="color:var(--ink-soft); font-size:12px;">${esc(c.note)}</span>` : ''
  ].filter(Boolean).join('<br>');
  $('#contactBox').innerHTML = contactLines;
  $('#applyBtn').href = applyUrl;

  $('#sourceNote').textContent = meta.sourceNote || '';
})();
</script>
</body>
</html>
